name: Update listings

on:
  schedule:
    - cron: '0 1 * * *'   # daily 06:00 Almaty
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-listings

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy opencv-python-headless
      - run: python scrape.py
      - run: python build.py
      - name: Commit data (Vercel redeploys on push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "Update listings $(date -u +%F)"; git push; }
